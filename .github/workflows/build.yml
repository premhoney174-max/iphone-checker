name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p proj/app/src/main/java/com/starmobiles/iphonecheck
          cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "StarIphoneChecker"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.starmobiles.iphonecheck"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.starmobiles.iphonecheck"
              minSdk = 26
              targetSdk = 34
              versionCode = 7
              versionName = "0.7"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            packaging { resources.excludes.add("META-INF/versions/9/OSGI-INF/MANIFEST.MF") }
          }
          dependencies {
            implementation("org.bouncycastle:bcprov-jdk18on:1.78.1")
            implementation("org.bouncycastle:bcpkix-jdk18on:1.78.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.usb.host" android:required="true"/>
            <application android:label="STAR iPhone Checker" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/starmobiles/iphonecheck/MainActivity.kt <<'EOF'
          package com.starmobiles.iphonecheck

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.*
          import android.hardware.usb.*
          import android.os.Build
          import android.os.Bundle
          import android.util.Base64
          import android.widget.*
          import java.io.ByteArrayOutputStream
          import java.math.BigInteger
          import java.net.Socket
          import java.nio.ByteBuffer
          import java.security.KeyFactory
          import java.security.KeyPairGenerator
          import java.security.Principal
          import java.security.PrivateKey
          import java.security.PublicKey
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate
          import java.security.spec.PKCS8EncodedKeySpec
          import java.security.spec.RSAPublicKeySpec
          import java.security.spec.X509EncodedKeySpec
          import java.util.Date
          import java.util.UUID
          import javax.net.ssl.KeyManager
          import javax.net.ssl.SSLContext
          import javax.net.ssl.SSLEngine
          import javax.net.ssl.SSLEngineResult
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509KeyManager
          import javax.net.ssl.X509TrustManager
          import org.bouncycastle.asn1.x500.X500Name
          import org.bouncycastle.asn1.x509.BasicConstraints
          import org.bouncycastle.asn1.x509.Extension
          import org.bouncycastle.asn1.x509.KeyUsage
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter
          import org.bouncycastle.cert.jcajce.JcaX509ExtensionUtils
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
          import org.w3c.dom.Element

          class Mux(private val c: UsbDeviceConnection, private val ein: UsbEndpoint, private val eout: UsbEndpoint) {
              private var tx = 0
              private var rx = 0xFFFF
              private var seq = 0
              private var ack = 0
              private var dport = 0
              private var sport = 49152
              private var conns = 0
              private val acc = ByteArrayOutputStream()
              val dbg = StringBuilder()

              private fun hex(b: ByteArray) = b.take(40).joinToString("") { "%02x".format(it) }

              class In(val flags: Int, val seq: Int, val data: ByteArray, val dst: Int)

              private fun raw(b: ByteArray): Boolean {
                  val n = c.bulkTransfer(eout, b, b.size, 3000)
                  dbg.append("TX ").append(b.size).append(" -> ").append(n).append("\n")
                  return n >= 0
              }

              private fun rd(t: Int = 2000): ByteArray? {
                  val b = ByteArray(16384)
                  val n = c.bulkTransfer(ein, b, b.size, t)
                  dbg.append("RX ").append(n)
                  if (n > 0) dbg.append(" ").append(hex(b.copyOf(n)))
                  dbg.append("\n")
                  return if (n > 0) b.copyOf(n) else null
              }

              private fun drain() {
                  repeat(3) { if (rd(300) == null) return }
              }

              private fun pkt(proto: Int, body: ByteArray): ByteArray {
                  val b = ByteBuffer.allocate(16 + body.size)
                  b.putInt(proto); b.putInt(16 + body.size); b.putInt(0xFEEDFACE.toInt())
                  b.putShort(tx.toShort()); b.putShort(rx.toShort()); b.put(body)
                  tx = (tx + 1) and 0xFFFF
                  return b.array()
              }

              private fun tcp(flags: Int, data: ByteArray = ByteArray(0)): ByteArray {
                  val b = ByteBuffer.allocate(20 + data.size)
                  b.putShort(sport.toShort()); b.putShort(dport.toShort())
                  b.putInt(seq); b.putInt(ack)
                  b.put(0x50.toByte()); b.put(flags.toByte())
                  b.putShort(512.toShort()); b.putShort(0); b.putShort(0)
                  b.put(data)
                  return pkt(6, b.array())
              }

              private val rbuf = ByteArrayOutputStream()
              private val q = java.util.ArrayDeque<In>()

              private fun recv(): In? {
                  repeat(8) {
                      q.pollFirst()?.let { return it }
                      val r = rd() ?: return null
                      rbuf.write(r)
                      val a = rbuf.toByteArray()
                      val bb = ByteBuffer.wrap(a)
                      var off = 0
                      while (a.size - off >= 16) {
                          val len = bb.getInt(off + 4)
                          if (len < 16 || len > 70000) { off = a.size; break }
                          if (a.size - off < len) break
                          val proto = bb.getInt(off)
                          rx = bb.getShort(off + 12).toInt() and 0xFFFF
                          if (proto == 6 && len >= 36) {
                              val hl = ((a[off + 28].toInt() and 0xF0) shr 4) * 4
                              if (16 + hl <= len) {
                                  q.add(In(a[off + 29].toInt() and 0xFF, bb.getInt(off + 20), a.copyOfRange(off + 16 + hl, off + len), bb.getShort(off + 18).toInt() and 0xFFFF))
                              }
                          }
                          off += len
                      }
                      rbuf.reset()
                      if (off < a.size) rbuf.write(a, off, a.size - off)
                  }
                  return q.pollFirst()
              }

              private fun nextData(): ByteArray? {
                  repeat(12) {
                      val t = recv() ?: return null
                      if ((t.flags and 4) != 0) return null
                      if (t.data.isEmpty() || t.dst != sport) return@repeat
                      val end = t.seq + t.data.size
                      if (end - ack <= 0) {
                          dbg.append("dup ").append(t.seq).append("\n")
                          raw(tcp(0x10))
                          return@repeat
                      }
                      ack = end
                      raw(tcp(0x10))
                      return t.data
                  }
                  return null
              }

              fun start(): Boolean {
                  drain()
                  val v = ByteBuffer.allocate(20)
                  v.putInt(0); v.putInt(20); v.putInt(2); v.putInt(0); v.putInt(0)
                  if (!raw(v.array())) return false
                  repeat(4) {
                      val r = rd() ?: return false
                      if (r.size >= 12 && ByteBuffer.wrap(r).getInt(0) == 0) {
                          if (ByteBuffer.wrap(r).getInt(8) < 2) return false
                          return raw(pkt(2, byteArrayOf(7)))
                      }
                  }
                  return false
              }

              fun open(port: Int): Boolean {
                  dport = port; seq = 0; ack = 0; sport = 49152 + conns; conns++; acc.reset()
                  if (!raw(tcp(2))) return false
                  seq = 1
                  repeat(6) {
                      val t = recv() ?: return false
                      if (t.dst != sport) return@repeat
                      if ((t.flags and 0x12) == 0x12) { ack = t.seq + 1; return raw(tcp(0x10)) }
                      if ((t.flags and 4) != 0) return false
                  }
                  return false
              }

              private fun send(d: ByteArray): Boolean {
                  val ok = raw(tcp(0x10, d))
                  seq += d.size
                  return ok
              }

              private fun readMsg(): ByteArray? {
                  repeat(30) {
                      val a = acc.toByteArray()
                      if (a.size >= 4) {
                          val len = ByteBuffer.wrap(a).getInt()
                          if (len >= 0 && a.size >= 4 + len) {
                              acc.reset(); acc.write(a, 4 + len, a.size - 4 - len)
                              return a.copyOfRange(4, 4 + len)
                          }
                      }
                      val d = nextData() ?: return null
                      acc.write(d)
                  }
                  return null
              }

              fun ask(body: String, lbl: Boolean = true): String? {
                  if (!send(frame(body, lbl))) return null
                  return readMsg()?.toString(Charsets.UTF_8)
              }

              fun sendRaw(d: ByteArray): Boolean = send(d)

              fun recvRaw(): ByteArray? = nextData()

              fun closeConn() { try { raw(tcp(4)) } catch (e: Exception) { } }

              fun close() {
                  try { raw(tcp(4)) } catch (e: Exception) { }
                  try { c.close() } catch (e: Exception) { }
              }
          }

          fun frame(body: String, lbl: Boolean = true): ByteArray {
              val x = ("<?xml version=\"1.0\" encoding=\"UTF-8\"?><plist version=\"1.0\"><dict>" + (if (lbl) "<key>Label</key><string>STAR</string>" else "") + body + "</dict></plist>").toByteArray()
              val b = ByteBuffer.allocate(4 + x.size)
              b.putInt(x.size); b.put(x)
              return b.array()
          }

          fun dive(e: Element?, vararg path: String): Element? {
              var cur = e
              for (p in path) cur = if (cur == null) null else kv(cur).firstOrNull { it.first == p }?.second
              return cur
          }

          fun valOf(x: String?): Element? = if (x == null) null else parse(x).firstOrNull { it.first == "Value" }?.second

          class Pairing(
              val hostId: String, val buid: String, val hostCert: String, val hostKey: PrivateKey,
              val rootCert: String, val deviceCert: String, val hostCertObj: X509Certificate, val rootCertObj: X509Certificate
          )

          fun pem(label: String, der: ByteArray): String {
              val b = Base64.encodeToString(der, Base64.NO_WRAP)
              return "-----BEGIN " + label + "-----\n" + b.chunked(64).joinToString("\n") + "\n-----END " + label + "-----\n"
          }

          fun b64(s: String): String = Base64.encodeToString(s.toByteArray(), Base64.NO_WRAP)

          fun parsePub(p: String): PublicKey {
              val der = Base64.decode(p.lines().filter { !it.startsWith("-----") }.joinToString(""), Base64.DEFAULT)
              val kf = KeyFactory.getInstance("RSA")
              return if (p.contains("RSA PUBLIC KEY")) {
                  val rp = org.bouncycastle.asn1.pkcs.RSAPublicKey.getInstance(der)
                  kf.generatePublic(RSAPublicKeySpec(rp.modulus, rp.publicExponent))
              } else kf.generatePublic(X509EncodedKeySpec(der))
          }

          fun makeCert(subject: String, issuer: String, pub: PublicKey, signKey: PrivateKey, ca: Boolean): X509Certificate {
              val now = System.currentTimeMillis()
              val b = JcaX509v3CertificateBuilder(
                  X500Name("CN=" + issuer), BigInteger.ONE, Date(now - 86400000L), Date(now + 3650L * 86400000L),
                  X500Name("CN=" + subject), pub
              )
              b.addExtension(Extension.basicConstraints, true, BasicConstraints(ca))
              b.addExtension(Extension.subjectKeyIdentifier, false, JcaX509ExtensionUtils().createSubjectKeyIdentifier(pub))
              if (!ca) b.addExtension(Extension.keyUsage, true, KeyUsage(KeyUsage.digitalSignature or KeyUsage.keyEncipherment))
              return JcaX509CertificateConverter().getCertificate(b.build(JcaContentSignerBuilder("SHA256withRSA").build(signKey)))
          }

          fun newPairing(devPubPem: String): Pairing {
              val g = KeyPairGenerator.getInstance("RSA")
              g.initialize(2048)
              val root = g.generateKeyPair()
              val host = g.generateKeyPair()
              val rc = makeCert("root", "root", root.public, root.private, true)
              val hc = makeCert("host", "root", host.public, root.private, false)
              val dc = makeCert("device", "root", parsePub(devPubPem), root.private, false)
              return Pairing(
                  UUID.randomUUID().toString().uppercase(), UUID.randomUUID().toString().uppercase(),
                  pem("CERTIFICATE", hc.encoded), host.private, pem("CERTIFICATE", rc.encoded),
                  pem("CERTIFICATE", dc.encoded), hc, rc
              )
          }

          fun sslEngine(p: Pairing): SSLEngine {
              val km = object : X509KeyManager {
                  override fun getClientAliases(t: String?, i: Array<Principal>?): Array<String>? = arrayOf("h")
                  override fun chooseClientAlias(t: Array<String>?, i: Array<Principal>?, s: Socket?): String? = "h"
                  override fun getServerAliases(t: String?, i: Array<Principal>?): Array<String>? = null
                  override fun chooseServerAlias(t: String?, i: Array<Principal>?, s: Socket?): String? = null
                  override fun getCertificateChain(a: String?): Array<X509Certificate> = arrayOf(p.hostCertObj, p.rootCertObj)
                  override fun getPrivateKey(a: String?): PrivateKey = p.hostKey
              }
              val tm = object : X509TrustManager {
                  override fun checkClientTrusted(c: Array<X509Certificate>?, a: String?) {}
                  override fun checkServerTrusted(c: Array<X509Certificate>?, a: String?) {}
                  override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
              }
              val ctx = SSLContext.getInstance("TLS")
              ctx.init(arrayOf<KeyManager>(km), arrayOf<TrustManager>(tm), null)
              val e = ctx.createSSLEngine()
              e.useClientMode = true
              e.enabledProtocols = arrayOf("TLSv1.2")
              e.enabledCipherSuites = e.supportedCipherSuites
              return e
          }

          class Tls(private val m: Mux, private val e: SSLEngine) {
              private val inNet = ByteBuffer.allocate(1 shl 17).apply { flip() }
              private val app = ByteArrayOutputStream()

              private fun fill(): Boolean {
                  val d = m.recvRaw() ?: return false
                  inNet.compact(); inNet.put(d); inNet.flip()
                  return true
              }

              private fun wrapSend(src: ByteBuffer) {
                  val out = ByteBuffer.allocate(e.session.packetBufferSize + 1024)
                  e.wrap(src, out)
                  out.flip()
                  if (out.hasRemaining()) {
                      val b = ByteArray(out.remaining())
                      out.get(b)
                      m.sendRaw(b)
                  }
              }

              private fun pump(): Boolean {
                  if (!inNet.hasRemaining() && !fill()) return false
                  val dst = ByteBuffer.allocate(e.session.applicationBufferSize)
                  val r = e.unwrap(inNet, dst)
                  if (dst.position() > 0) app.write(dst.array(), 0, dst.position())
                  if (r.status == SSLEngineResult.Status.BUFFER_UNDERFLOW && !fill()) return false
                  return true
              }

              fun handshake(): Boolean {
                  e.beginHandshake()
                  var n = 0
                  while (n++ < 300) {
                      when (e.handshakeStatus) {
                          SSLEngineResult.HandshakeStatus.NEED_WRAP -> wrapSend(ByteBuffer.allocate(0))
                          SSLEngineResult.HandshakeStatus.NEED_UNWRAP -> if (!pump()) return false
                          SSLEngineResult.HandshakeStatus.NEED_TASK -> {
                              var t = e.delegatedTask
                              while (t != null) { t.run(); t = e.delegatedTask }
                          }
                          else -> return true
                      }
                  }
                  return false
              }

              private fun readMsg(): ByteArray? {
                  repeat(40) {
                      val a = app.toByteArray()
                      if (a.size >= 4) {
                          val len = ByteBuffer.wrap(a).getInt()
                          if (len >= 0 && a.size >= 4 + len) {
                              app.reset(); app.write(a, 4 + len, a.size - 4 - len)
                              return a.copyOfRange(4, 4 + len)
                          }
                      }
                      if (!pump()) return null
                  }
                  return null
              }

              fun ask(body: String, lbl: Boolean = true): String? {
                  val src = ByteBuffer.wrap(frame(body, lbl))
                  while (src.hasRemaining()) wrapSend(src)
                  return readMsg()?.toString(Charsets.UTF_8)
              }
          }

          fun kv(d: Element): List<Pair<String, Element>> {
              val out = ArrayList<Pair<String, Element>>()
              var key: String? = null
              val ch = d.childNodes
              for (i in 0 until ch.length) {
                  val n = ch.item(i)
                  if (n !is Element) continue
                  if (n.tagName == "key") key = n.textContent
                  else if (key != null) { out.add(Pair(key, n)); key = null }
              }
              return out
          }

          fun parse(x: String): List<Pair<String, Element>> {
              val s = x.replace(Regex("<!DOCTYPE[^>]*>"), "")
              val doc = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(s.byteInputStream())
              return kv(doc.documentElement.getElementsByTagName("dict").item(0) as Element)
          }

          fun show(e: Element): String = when (e.tagName) {
              "true" -> "Yes"
              "false" -> "No"
              "dict", "array", "data" -> "(" + e.tagName + ")"
              else -> e.textContent
          }

          val MODELS = mapOf(
              "iPhone12,1" to "iPhone 11", "iPhone12,3" to "iPhone 11 Pro", "iPhone12,5" to "iPhone 11 Pro Max",
              "iPhone12,8" to "iPhone SE (2nd gen)",
              "iPhone13,1" to "iPhone 12 mini", "iPhone13,2" to "iPhone 12", "iPhone13,3" to "iPhone 12 Pro",
              "iPhone13,4" to "iPhone 12 Pro Max",
              "iPhone14,4" to "iPhone 13 mini", "iPhone14,5" to "iPhone 13", "iPhone14,2" to "iPhone 13 Pro",
              "iPhone14,3" to "iPhone 13 Pro Max", "iPhone14,6" to "iPhone SE (3rd gen)",
              "iPhone14,7" to "iPhone 14", "iPhone14,8" to "iPhone 14 Plus", "iPhone15,2" to "iPhone 14 Pro",
              "iPhone15,3" to "iPhone 14 Pro Max",
              "iPhone15,4" to "iPhone 15", "iPhone15,5" to "iPhone 15 Plus", "iPhone16,1" to "iPhone 15 Pro",
              "iPhone16,2" to "iPhone 15 Pro Max",
              "iPhone17,3" to "iPhone 16", "iPhone17,4" to "iPhone 16 Plus", "iPhone17,1" to "iPhone 16 Pro",
              "iPhone17,2" to "iPhone 16 Pro Max", "iPhone17,5" to "iPhone 16e"
          )

          val WANTED = listOf(
              "ProductVersion" to "iOS version", "BuildVersion" to "Build", "DeviceName" to "Name",
              "HardwareModel" to "Board", "ModelNumber" to "Model number", "RegionInfo" to "Region",
              "SerialNumber" to "Serial", "UniqueDeviceID" to "UDID", "ActivationState" to "Activation",
              "InternationalMobileEquipmentIdentity" to "IMEI", "PasswordProtected" to "Passcode set"
          )

          class MainActivity : Activity() {
              private val PERM = "com.starmobiles.iphonecheck.USB_PERM"
              private lateinit var out: TextView
              private lateinit var usb: UsbManager
              @Volatile private var busy = false
              private var info = ""
              private var last = ""

              private val rx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (i.action == UsbManager.ACTION_USB_DEVICE_DETACHED) {
                          if (!busy) out.text = "WARNING: iPhone disconnected. Reconnect the cable and press Scan.\n\n" + last
                      } else scan()
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  usb = getSystemService(Context.USB_SERVICE) as UsbManager
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 32)
                  }
                  val btn = Button(this).apply {
                      text = "Scan iPhone"
                      setOnClickListener { scan() }
                  }
                  out = TextView(this).apply { textSize = 16f; setTextIsSelectable(true) }
                  root.addView(btn)
                  root.addView(ScrollView(this).apply { addView(out) })
                  setContentView(root)
                  val f = IntentFilter().apply {
                      addAction(PERM)
                      addAction(UsbManager.ACTION_USB_DEVICE_DETACHED)
                  }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(rx, f)
              }

              override fun onDestroy() { super.onDestroy(); unregisterReceiver(rx) }

              private fun openMux(d: UsbDevice): Mux? {
                  for (ci in 0 until d.configurationCount) {
                      val cfg = d.getConfiguration(ci)
                      for (k in 0 until cfg.interfaceCount) {
                          val itf = cfg.getInterface(k)
                          if (itf.interfaceClass != 255 || itf.interfaceSubclass != 254 || itf.interfaceProtocol != 2) continue
                          val conn = usb.openDevice(d) ?: return null
                          if (!conn.claimInterface(itf, true)) {
                              conn.setConfiguration(cfg)
                              if (!conn.claimInterface(itf, true)) continue
                          }
                          var i: UsbEndpoint? = null
                          var o: UsbEndpoint? = null
                          for (e in 0 until itf.endpointCount) {
                              val ep = itf.getEndpoint(e)
                              if (ep.type == UsbConstants.USB_ENDPOINT_XFER_BULK) {
                                  if (ep.direction == UsbConstants.USB_DIR_IN) i = ep else o = ep
                              }
                          }
                          if (i != null && o != null) {
                              info = "cfg " + cfg.id + " itf " + itf.id + " in " + i.address + "/" + i.maxPacketSize + " out " + o.address + "/" + o.maxPacketSize
                              return Mux(conn, i, o)
                          }
                      }
                  }
                  return null
              }

              private var pairErr = ""

              private fun say(s: String) { runOnUiThread { out.text = s } }

              private fun loadPair(udid: String): Pairing? {
                  val s = getSharedPreferences("pairs", MODE_PRIVATE).getString(udid, null) ?: return null
                  val f = s.split("|")
                  if (f.size < 6) return null
                  return try {
                      val cf = CertificateFactory.getInstance("X.509")
                      val hc = cf.generateCertificate(f[2].byteInputStream()) as X509Certificate
                      val rc = cf.generateCertificate(f[4].byteInputStream()) as X509Certificate
                      val key = KeyFactory.getInstance("RSA").generatePrivate(PKCS8EncodedKeySpec(Base64.decode(f[3], Base64.DEFAULT)))
                      Pairing(f[0], f[1], f[2], key, f[4], f[5], hc, rc)
                  } catch (e: Exception) { null }
              }

              private fun savePair(udid: String, p: Pairing) {
                  val s = listOf(p.hostId, p.buid, p.hostCert, Base64.encodeToString(p.hostKey.encoded, Base64.NO_WRAP), p.rootCert, p.deviceCert).joinToString("|")
                  getSharedPreferences("pairs", MODE_PRIVATE).edit().putString(udid, s).apply()
              }

              private fun forgetPair(udid: String) {
                  getSharedPreferences("pairs", MODE_PRIVATE).edit().remove(udid).apply()
              }

              private fun pair(mux: Mux): Pairing? {
                  val dv = valOf(mux.ask("<key>Request</key><string>GetValue</string><key>Key</key><string>DevicePublicKey</string>"))
                  if (dv == null) { pairErr = "no device key"; return null }
                  val p = newPairing(String(Base64.decode(dv.textContent.trim(), Base64.DEFAULT)))
                  val body = "<key>Request</key><string>Pair</string><key>PairRecord</key><dict>" +
                      "<key>DeviceCertificate</key><data>" + b64(p.deviceCert) + "</data>" +
                      "<key>HostCertificate</key><data>" + b64(p.hostCert) + "</data>" +
                      "<key>HostID</key><string>" + p.hostId + "</string>" +
                      "<key>RootCertificate</key><data>" + b64(p.rootCert) + "</data>" +
                      "<key>SystemBUID</key><string>" + p.buid + "</string></dict>" +
                      "<key>ProtocolVersion</key><string>2</string>" +
                      "<key>PairingOptions</key><dict><key>ExtendedPairingErrors</key><true/></dict>"
                  repeat(30) {
                      val r = mux.ask(body)
                      if (r == null) { pairErr = "no reply from iPhone"; return null }
                      val e = parse(r).firstOrNull { it.first == "Error" }?.second?.textContent
                      if (e == null) return p
                      if (e != "PairingDialogResponsePending") { pairErr = e; return null }
                      Thread.sleep(2000)
                  }
                  pairErr = "Trust was not tapped in time"
                  return null
              }

              private fun session(mux: Mux, p: Pairing): Tls? {
                  val r = mux.ask("<key>Request</key><string>StartSession</string><key>HostID</key><string>" + p.hostId + "</string><key>SystemBUID</key><string>" + p.buid + "</string>") ?: return null
                  val t = parse(r)
                  if (t.any { it.first == "Error" }) return null
                  if (t.firstOrNull { it.first == "EnableSessionSSL" }?.second?.tagName != "true") return null
                  val tls = Tls(mux, sslEngine(p))
                  return if (tls.handshake()) tls else null
              }

              private fun gbs(s: String?): String? {
                  val v = s?.toDoubleOrNull() ?: return null
                  return String.format("%.0f GB", v / 1e9)
              }

              private fun fmt(rows: Map<String, String>): String {
                  val sb = StringBuilder()
                  val used = HashSet<String>()
                  fun line(label: String, v: String?, vararg keys: String) {
                      if (v != null) sb.append(label).append(": ").append(v).append("\n")
                      used.addAll(keys)
                  }
                  val pt = rows["ProductType"]
                  sb.append("MODEL: ").append(MODELS[pt] ?: "Unknown").append("  (").append(pt ?: "N/A").append(")\n")
                  line("iOS", (rows["ProductVersion"] ?: "?") + " (" + (rows["BuildVersion"] ?: "?") + ")", "ProductVersion", "BuildVersion", "ProductType")
                  line("Serial", rows["SerialNumber"], "SerialNumber")
                  line("IMEI", rows["InternationalMobileEquipmentIdentity"], "InternationalMobileEquipmentIdentity")
                  line("IMEI 2", rows["InternationalMobileEquipmentIdentity2"], "InternationalMobileEquipmentIdentity2")
                  line("Model no", rows["ModelNumber"], "ModelNumber")
                  line("Region", rows["RegionInfo"], "RegionInfo")
                  line("Activation", rows["ActivationState"], "ActivationState")
                  line("Find My iPhone", rows["fmip"]?.let { if (it == "Yes") "ON (iCloud locked)" else "OFF" }, "fmip")
                  line("Storage", gbs(rows["disk.TotalDiskCapacity"]), "disk.TotalDiskCapacity")
                  line("Free space", gbs(rows["disk.AmountDataAvailable"]), "disk.AmountDataAvailable")
                  line("Battery level", rows["bat.BatteryCurrentCapacity"]?.let { it + "%" }, "bat.BatteryCurrentCapacity")
                  line("Color code", rows["DeviceColor"], "DeviceColor")
                  line("Enclosure color", rows["DeviceEnclosureColor"], "DeviceEnclosureColor")
                  line("Wi-Fi MAC", rows["WiFiAddress"], "WiFiAddress")
                  line("Bluetooth MAC", rows["BluetoothAddress"], "BluetoothAddress")
                  line("Name", rows["DeviceName"], "DeviceName")
                  line("UDID", rows["UniqueDeviceID"], "UniqueDeviceID")
                  val bd = rows["batt.DesignCapacity"]?.toDoubleOrNull()
                  val bn = (rows["batt.NominalChargeCapacity"] ?: rows["batt.AppleRawMaxCapacity"])?.toDoubleOrNull()
                  val hp = rows["batt.MaximumCapacityPercent"]?.toDoubleOrNull() ?: (if (bd != null && bn != null && bd > 0) bn / bd * 100 else null)
                  line("Battery health", hp?.let { String.format("%.0f%%", it) })
                  line("Charge cycles", rows["batt.CycleCount"])
                  line("Design capacity", bd?.let { String.format("%.0f mAh", it) })
                  line("Current max capacity", bn?.let { String.format("%.0f mAh", it) })
                  line("Battery temp", rows["batt.Temperature"]?.toDoubleOrNull()?.let { String.format("%.1f C", it / 100) })
                  line("Battery serial", rows["batt.Serial"] ?: rows["batt.BatterySerialNumber"])
                  line("Battery note", rows["batt.note"])
                  sb.append("\n--- Other values ---\n")
                  for ((k, v) in rows) if (k !in used && !k.startsWith("batt.") && !v.startsWith("(")) sb.append(k).append(": ").append(v).append("\n")
                  return sb.toString()
              }

              private fun query(d: UsbDevice): String {
                  val mux = openMux(d) ?: return "Could not open the USB channel. Unplug, replug, unlock iPhone and scan again."
                  try { return query2(mux) } finally { mux.close() }
              }

              private fun query2(mux: Mux): String {
                  if (!mux.start()) return "usbmux handshake failed.\n" + info + "\n" + mux.dbg
                  if (!mux.open(62078)) return "iPhone info service did not answer.\n" + info + "\n" + mux.dbg
                  val rows = LinkedHashMap<String, String>()
                  fun addAll(r: String?, prefix: String) {
                      try {
                          val v = valOf(r)
                          if (v != null && v.tagName == "dict") for ((k, e) in kv(v)) rows[prefix + k] = show(e)
                      } catch (e: Exception) { }
                  }
                  addAll(mux.ask("<key>Request</key><string>GetValue</string>"), "")
                  if (rows.isEmpty()) return "No data received.\n" + mux.dbg
                  val udid = rows["UniqueDeviceID"]
                  var pairing: Pairing? = if (udid != null) loadPair(udid) else null
                  var tls: Tls? = null
                  try {
                      if (pairing != null) {
                          tls = session(mux, pairing)
                          if (tls == null) {
                              forgetPair(udid!!)
                              return fmt(rows) + "\n\nSaved trust was rejected. Press Scan again and tap Trust."
                          }
                      } else {
                          say(fmt(rows) + "\n\nTap TRUST on the iPhone (enter its passcode if asked)...")
                          pairing = pair(mux)
                          if (pairing == null) return fmt(rows) + "\n\nPairing failed: " + pairErr
                          if (udid != null) savePair(udid, pairing)
                          tls = session(mux, pairing)
                      }
                  } catch (e: Exception) {
                      return fmt(rows) + "\n\nSecure step error: " + e.toString().take(160) + "\n" + mux.dbg.takeLast(700)
                  }
                  if (tls == null) return fmt(rows) + "\n\nPaired, but the secure session failed. Press Scan again."
                  val t: Tls = tls
                  fun dom(domain: String, key: String?): String? =
                      t.ask("<key>Request</key><string>GetValue</string><key>Domain</key><string>" + domain + "</string>" +
                          (if (key != null) "<key>Key</key><string>" + key + "</string>" else ""))
                  try {
                      addAll(t.ask("<key>Request</key><string>GetValue</string>"), "")
                      addAll(dom("com.apple.disk_usage", null), "disk.")
                      addAll(dom("com.apple.mobile.battery", null), "bat.")
                      valOf(dom("com.apple.fmip", "IsAssociated"))?.let { rows["fmip"] = show(it) }
                  } catch (e: Exception) {
                      return fmt(rows) + "\n\nRead error: " + e.toString().take(160) + "\n" + mux.dbg.takeLast(700)
                  }
                  val pr = pairing ?: return fmt(rows)
                  var note = ""
                  try {
                      val raw = t.ask("<key>Request</key><string>StartService</string><key>Service</key><string>com.apple.mobile.diagnostics_relay</string>")
                      val sr = if (raw != null) parse(raw) else emptyList()
                      val port = sr.firstOrNull { it.first == "Port" }?.second?.textContent?.trim()?.toIntOrNull()
                      val ssl = sr.firstOrNull { it.first == "EnableServiceSSL" }?.second?.tagName == "true"
                      if (port == null) {
                          note = "Battery service refused: " + (sr.firstOrNull { it.first == "Error" }?.second?.textContent ?: "no reply")
                      } else {
                          mux.closeConn()
                          if (!mux.open(port)) {
                              note = "Battery service did not connect"
                          } else {
                              val body = "<key>Request</key><string>IORegistry</string><key>EntryClass</key><string>IOPMPowerSource</string>"
                              var resp: String? = null
                              if (ssl) {
                                  val st = Tls(mux, sslEngine(pr))
                                  if (st.handshake()) resp = st.ask(body, false) else note = "Battery secure session failed"
                              } else resp = mux.ask(body, false)
                              if (resp != null) {
                                  val reg = dive(parse(resp).firstOrNull { it.first == "Diagnostics" }?.second, "IORegistry")
                                  if (reg == null) {
                                      note = "No battery data returned"
                                  } else {
                                      for ((k2, e2) in kv(reg)) rows["batt." + k2] = show(e2)
                                      dive(reg, "BatteryData")?.let { bd -> for ((k3, e3) in kv(bd)) rows.putIfAbsent("batt." + k3, show(e3)) }
                                  }
                              } else if (note.isEmpty()) note = "No battery reply"
                          }
                      }
                  } catch (e: Exception) { note = "Battery error: " + e.toString().take(120) }
                  if (note.isNotEmpty()) rows["batt.note"] = note
                  return fmt(rows)
              }

              private fun scan() {
                  if (busy) return
                  val list = usb.deviceList.values.filter { it.vendorId == 0x05AC }
                  if (list.isEmpty()) {
                      out.text = "No iPhone found.\n\n1. Connect cable\n2. Unlock iPhone\n3. Tap Trust if asked\n4. Press Scan"
                      return
                  }
                  val d = list[0]
                  if (!usb.hasPermission(d)) {
                      val pi = PendingIntent.getBroadcast(this, 0, Intent(PERM).setPackage(packageName), PendingIntent.FLAG_MUTABLE)
                      usb.requestPermission(d, pi)
                      out.text = "Allow USB access on the popup."
                      return
                  }
                  busy = true
                  out.text = "Reading iPhone... keep it unlocked."
                  Thread {
                      val r = try { query(d) } catch (e: Exception) { "Error: " + e.toString() }
                      runOnUiThread { out.text = r; last = r; busy = false }
                  }.start()
              }
          }
          EOF
      - name: Build
        working-directory: proj
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StarIphoneChecker-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
